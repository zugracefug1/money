name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # 로직 단위 테스트 + 모든 화면이 예외 없이 그려지는지(tests/test_app.py, Streamlit AppTest)
      - run: python -m pytest -q
